services:
  - type: web
    name: prepreach-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: apps/server
    buildCommand: pnpm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://prepreach.vercel.app
